[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohit Chillara", email = "rohitchillara@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-neo4j>=0.10.0",
    "langchain-openai>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "neo4j>=6.2.0",
    "ollama>=0.6.2",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
agent = "agent.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
